services:
  - type: web
    name: nirikshak-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/app/requirements.txt
    startCommand: cd backend/app && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./nirikshak.db
      - key: AUTO_SEED_SQLITE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
